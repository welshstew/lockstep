# Grype allowlist. Every entry's `reason` MUST end with "until YYYY-MM-DD": scan/summarize.py
# fails the gate once that date passes, so accepted risks get reviewed again (Grype has no
# native expiry). Prefer `make bump-base-images` over adding entries here.
ignore:
  - vulnerability: CVE-2026-102010
    package:
      name: libgcc
      type: rpm
    reason: >-
      Fixed in Hummingbird libgcc 16.2.1-3.2.hum1, but no hi/python:3.14 build ships it yet
      (checked 2026-11-08), and distroless has no dnf to patch. Flaw is in libstdc++ erase_if on a
      binary heap; this app is pure Python. Re-run make bump-base-images and drop this entry until 2026-11-22
  - vulnerability: CVE-2026-102010
    package:
      name: libstdc\+\+   # escaped: Grype matches package names as regex
      type: rpm
    reason: >-
      Same as libgcc above: vendor fix not yet in a published hi/python image until 2026-11-22
