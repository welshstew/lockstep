name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please don't include secret values, tokens or internal hostnames. Security issues: see SECURITY.md."
  - type: textarea
    id: what
    attributes: {label: What happened, description: "What you did, what you expected, and what happened instead."}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Lockstep version or image tag}
  - type: input
    id: vault
    attributes: {label: Vault version(s), placeholder: "e.g. 1.21.4"}
  - type: dropdown
    id: deploy
    attributes:
      label: Deployment
      options: [Helm chart, Container (compose/podman/docker), Local development stack, Other]
  - type: textarea
    id: logs
    attributes: {label: Logs, description: "Relevant app logs (they never contain values).", render: text}
