# Release on a version tag (vX.Y.Z, or vX.Y.Z-rc.N for a pre-release):
#   1. the tag must match the versions in the repository (scripts/check-version.sh)
#   2. the same security gate and browser tests as every pull request
#   3. a multi-arch image (linux/amd64, linux/arm64) pushed to ghcr.io/<owner>/lockstep,
#      with an SBOM and provenance attached, and signed with cosign (keyless, GitHub OIDC)
#   4. the Helm chart pushed as an OCI artifact to ghcr.io/<owner>/charts/lockstep, signed
#   5. a GitHub Release with that version's CHANGELOG.md section and install instructions
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          ./scripts/check-version.sh "$GITHUB_REF_NAME"
          v=${GITHUB_REF_NAME#v}
          echo "version=$v" >> "$GITHUB_OUTPUT"
          [[ $v == *-* ]] && echo "prerelease=true" >> "$GITHUB_OUTPUT" || echo "prerelease=false" >> "$GITHUB_OUTPUT"

  security:
    needs: verify
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  e2e:
    needs: verify
    uses: ./.github/workflows/e2e.yml

  image:
    needs: [verify, security, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless cosign signing
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/lockstep
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=${{ needs.verify.outputs.prerelease == 'false' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.verify.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=Lockstep
            org.opencontainers.image.description=Compare, inspect and sync KV secrets across HashiCorp Vault clusters
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.url=https://getlockstep.cloud
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image
        run: cosign sign --yes "$IMAGE@${{ steps.build.outputs.digest }}"

  chart:
    needs: [verify, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      - id: push
        name: Package and push the chart
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source scan/versions.env
          mkdir -p "$RUNNER_TEMP/helm"
          helm() { docker run --rm -v "$PWD:/w" -w /w -v "$RUNNER_TEMP/helm:/root/.config/helm" "$HELM_IMG" "$@"; }
          echo "$TOKEN" | docker run --rm -i -v "$RUNNER_TEMP/helm:/root/.config/helm" "$HELM_IMG" \
            registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/lockstep -d dist
          out=$(helm push "dist/lockstep-${{ needs.verify.outputs.version }}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts" 2>&1)
          echo "$out"
          digest=$(sed -n 's/^Digest: //p' <<<"$out")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Sign the chart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/charts/lockstep@${{ steps.push.outputs.digest }}"

  release:
    needs: [verify, image, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          CHART_DIGEST: ${{ needs.chart.outputs.digest }}
        run: |
          set -euo pipefail
          ./scripts/release-notes.sh "$VERSION" > notes.md
          cat notes.md
          flags=()
          [[ "${{ needs.verify.outputs.prerelease }}" == true ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --title "Lockstep $VERSION" --notes-file notes.md "${flags[@]}"
