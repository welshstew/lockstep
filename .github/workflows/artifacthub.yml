# Push the Artifact Hub repository metadata (charts/lockstep/artifacthub-repo.yml) next to the
# chart in GHCR, as the OCI artifact ghcr.io/<owner>/charts/lockstep:artifacthub.io.
name: artifacthub

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [charts/lockstep/artifacthub-repo.yml]

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Push the metadata
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ghcr.io/${{ github.repository_owner }}/charts/lockstep
        run: |
          set -euo pipefail
          if grep -q '^repositoryID: *REPLACE' charts/lockstep/artifacthub-repo.yml; then
            echo "::notice::artifacthub-repo.yml still has the placeholder repository ID; nothing pushed."
            exit 0
          fi
          source scan/versions.env
          echo "$TOKEN" | docker run --rm -i -v "$PWD/charts/lockstep:/w:ro" -w /w "$ORAS_IMG" \
            push "$REPO:artifacthub.io" --username "$ACTOR" --password-stdin \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
