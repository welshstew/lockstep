# Values for installing the chart into the dev k3s cluster (make helm-test).
image:
  repository: localhost/lockstep   # imported into k3s by make helm-test
  tag: "0.3.0"
  pullPolicy: Never
replicaCount: 2
vaults:
  - {name: Vault A, url: http://vault-a:8200}
  - {name: Vault B, url: http://vault-b:8200}
session:
  cookieSecure: false
kubernetesAuth:
  enabled: true
  roles: [lockstep-helm]
profiles:
  - name: Prod vs staging services
    leftMount: app-config
    rightMount: app-config
    rules:
      mappings: [{left: "services/*/prod/**", right: "services/*/staging/**"}]
      ignoreKeys: [{key: host, path: "services/**"}]
      ignorePaths: ["legacy/**", "retired/**"]
