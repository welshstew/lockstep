# Values for installing the chart into the dev k3s cluster (make helm-test).
image:
  repository: localhost/lockstep   # imported into k3s by make helm-test
  tag: "0.6.0"
  pullPolicy: Never
replicaCount: 2
vaults:
  - {name: Vault A, url: http://vault-a:8200}
  - {name: Vault B, url: http://vault-b:8200}
session:
  cookieSecure: false
kubernetesAuth:
  enabled: true
  roles: [lockstep-helm]
profiles:
  - name: Prod vs staging services
    leftMount: app-config
    rightMount: app-config
    rules:
      mappings: [{left: "services/*/prod/**", right: "services/*/staging/**"}]
      ignoreKeys: [{key: host, path: "services/**"}]
      ignorePaths: ["legacy/**", "retired/**"]
metrics:
  enabled: true
driftCheck:                         # suspended: make helm-test starts one run by hand
  enabled: true
  suspend: true
  left: {addr: "http://vault-a:8200", mount: app-config, prefix: services, name: vault-a, role: lockstep-helm-drift}
  right: {addr: "http://vault-b:8200", mount: app-config, prefix: services, name: vault-b, role: lockstep-helm-drift}
  waivers:
    - {path: "nothing/*", owner: platform, reason: an unused waiver is named in the log, expires: "2099-01-01"}
