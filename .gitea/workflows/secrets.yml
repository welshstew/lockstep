# Secret scan for pushes that change docs or notes. Those skip the full security scan
# (security.yml ignores **/*.md and docs/**), but a pasted token lands in a note as easily as in
# code. This runs gitleaks alone, with the same pinned binary and allowlist, in seconds.
name: secrets-scan

on:
  pull_request:
    paths: ['**/*.md', 'docs/**']
  push:
    branches: [main]
    paths: ['**/*.md', 'docs/**']
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the whole history, like security.yml

      - name: gitleaks (git history)
        run: |
          set -euo pipefail
          source scan/versions.env
          cid=$(docker create "$GITLEAKS_IMG")
          docker cp "$cid:/usr/bin/gitleaks" /usr/local/bin/
          docker rm "$cid" >/dev/null
          gitleaks version
          gitleaks git --no-banner --config .gitleaks.toml --redact --exit-code 1 .
