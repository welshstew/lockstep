apiVersion: v2
name: lockstep
description: Compare, inspect and sync KV secrets across HashiCorp Vault and OpenBao clusters.
type: application
version: 0.9.0
appVersion: "0.9.0"
kubeVersion: ">=1.27.0-0"
keywords: [vault, hashicorp-vault, openbao, secrets, kv, compare, sync, certificates]
icon: https://getlockstep.cloud/icon.svg
home: https://getlockstep.cloud
maintainers:
  - name: welshstew
    url: https://github.com/welshstew
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: security
  # The image this chart version runs: update with every release (scripts/check-version.sh checks it)
  artifacthub.io/images: |
    - name: lockstep
      image: ghcr.io/welshstew/lockstep:0.9.0
      platforms: [linux/amd64, linux/arm64]
  # What changed in this chart version, shown on Artifact Hub: rewrite for every release
  artifacthub.io/changes: |
    - kind: added
      description: "Tested against OpenBao 2.7, alone or with Vault on the other side"
    - kind: added
      description: "Configuration overview names the product: Vault, Vault Enterprise or OpenBao"
    - kind: added
      description: "Namespaces tested on OpenBao, including comparisons across namespaces"
    - kind: changed
      description: "Choose a role's, group's or user's policies from those on the Vault instead of typing them"
    - kind: changed
      description: "Configuration: built-in plugin versions and fields only one server returns no longer count as differences"
    - kind: security
      description: "Image rebuilt on the latest hardened Python base (CVE-2026-102010)"
  artifacthub.io/links: |
    - name: Website
      url: https://getlockstep.cloud
    - name: Documentation
      url: https://getlockstep.cloud/docs/
    - name: Live demo
      url: https://demo.getlockstep.cloud
    - name: Source
      url: https://github.com/welshstew/lockstep
sources:
  - https://github.com/welshstew/lockstep
