apiVersion: v2
name: lockstep
description: Compare, inspect and sync KV secrets across HashiCorp Vault and OpenBao clusters.
type: application
version: 0.12.0
appVersion: "0.12.0"
kubeVersion: ">=1.27.0-0"
keywords: [vault, hashicorp-vault, openbao, secrets, kv, compare, sync, certificates]
icon: https://getlockstep.cloud/icon.svg
home: https://getlockstep.cloud
maintainers:
  - name: welshstew
    url: https://github.com/welshstew
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: security
  # The image this chart version runs: update with every release (scripts/check-version.sh checks it)
  artifacthub.io/images: |
    - name: lockstep
      image: ghcr.io/welshstew/lockstep:0.12.0
      platforms: [linux/amd64, linux/arm64]
  # What changed in this chart version, shown on Artifact Hub: rewrite for every release
  artifacthub.io/changes: |
    - kind: added
      description: "Several approvers: plans.approvals and vaults[].approvals go up to 5, counted by Vault entity"
    - kind: added
      description: "Approver groups by Vault policy (plans.approverPolicies, vaults[].approverPolicies)"
    - kind: added
      description: "exportProtection and vaults[].exportProtection limit how exports are encrypted (key, passphrase, age, teams)"
    - kind: added
      description: "driftCheck.requireSigned and waiversSignature; the job gets plans.trustedKeys to check signed baselines and waivers"
    - kind: added
      description: "App: Only for (plan audience) in the UI, a Matrix baseline from an export file with accepted drift, and a Connections list on Browse and Matrix"
  artifacthub.io/links: |
    - name: Website
      url: https://getlockstep.cloud
    - name: Documentation
      url: https://getlockstep.cloud/docs/
    - name: Live demo
      url: https://demo.getlockstep.cloud
    - name: Source
      url: https://github.com/welshstew/lockstep
sources:
  - https://github.com/welshstew/lockstep
