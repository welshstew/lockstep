apiVersion: v2
name: lockstep
description: Compare, inspect and sync KV secrets across HashiCorp Vault and OpenBao clusters.
type: application
version: 0.10.0
appVersion: "0.10.0"
kubeVersion: ">=1.27.0-0"
keywords: [vault, hashicorp-vault, openbao, secrets, kv, compare, sync, certificates]
icon: https://getlockstep.cloud/icon.svg
home: https://getlockstep.cloud
maintainers:
  - name: welshstew
    url: https://github.com/welshstew
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: security
  # The image this chart version runs: update with every release (scripts/check-version.sh checks it)
  artifacthub.io/images: |
    - name: lockstep
      image: ghcr.io/welshstew/lockstep:0.10.0
      platforms: [linux/amd64, linux/arm64]
  # What changed in this chart version, shown on Artifact Hub: rewrite for every release
  artifacthub.io/changes: |
    - kind: added
      description: "Comparison profiles: value rewrites read a word on one side as another (test as dev) before comparing, and copies write the target side's word"
    - kind: added
      description: "Profile builder: Read both sides suggests mappings for renamed folders and rewrites for environment words, each with its reason, and explains the profile"
    - kind: added
      description: "Shared profiles (the profiles value) accept rewrites"
    - kind: fixed
      description: "Configuration: auth method fields only one server returns (OpenBao's status on JWT and OIDC) are no longer counted as differences"
  artifacthub.io/links: |
    - name: Website
      url: https://getlockstep.cloud
    - name: Documentation
      url: https://getlockstep.cloud/docs/
    - name: Live demo
      url: https://demo.getlockstep.cloud
    - name: Source
      url: https://github.com/welshstew/lockstep
sources:
  - https://github.com/welshstew/lockstep
