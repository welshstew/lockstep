apiVersion: v2
name: lockstep
description: Compare, inspect and sync KV secrets across HashiCorp Vault clusters.
type: application
version: 0.8.0
appVersion: "0.8.0"
kubeVersion: ">=1.27.0-0"
keywords: [vault, hashicorp-vault, secrets, kv, compare, sync, certificates]
icon: https://getlockstep.cloud/icon.svg
home: https://getlockstep.cloud
maintainers:
  - name: welshstew
    url: https://github.com/welshstew
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: security
  # The image this chart version runs: update with every release (scripts/check-version.sh checks it)
  artifacthub.io/images: |
    - name: lockstep
      image: ghcr.io/welshstew/lockstep:0.8.0
      platforms: [linux/amd64, linux/arm64]
  # What changed in this chart version, shown on Artifact Hub: rewrite for every release
  artifacthub.io/changes: |
    - kind: added
      description: "Try a draft policy for real with a short-lived token, and start a policy from a Browse folder"
    - kind: added
      description: "Edit identity groups' policies; userpass users and LDAP group mappings read and compared"
    - kind: added
      description: "New value userWrite (off by default): create userpass users and reset passwords on development Vaults"
    - kind: added
      description: "Configuration: Azure, GCP and LDAP engine roles; profiles that pair mounts with different paths (value configProfiles)"
    - kind: added
      description: "Configuration: copy a mount's tuning or an engine role to the other Vault through the access review"
    - kind: added
      description: "Compare: custom metadata as an option, and a one-click way back to the whole mount from a path prefix"
    - kind: added
      description: "Renew a connection's token"
    - kind: changed
      description: "A new look: navigation in a sticky top bar, new fonts and colours"
    - kind: fixed
      description: "Artifact Hub can read the chart's change log again (0.7.0's annotation was rejected)"
    - kind: fixed
      description: "Browse: a key's actions sit on one line again"
  artifacthub.io/links: |
    - name: Website
      url: https://getlockstep.cloud
    - name: Documentation
      url: https://getlockstep.cloud/docs/
    - name: Live demo
      url: https://demo.getlockstep.cloud
    - name: Source
      url: https://github.com/welshstew/lockstep
sources:
  - https://github.com/welshstew/lockstep
