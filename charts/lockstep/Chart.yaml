apiVersion: v2
name: lockstep
description: Compare, inspect and sync KV secrets across HashiCorp Vault clusters.
type: application
version: 0.5.0
appVersion: "0.5.0"
kubeVersion: ">=1.27.0-0"
keywords: [vault, hashicorp-vault, secrets, kv, compare, sync, certificates]
icon: https://getlockstep.cloud/icon.svg
home: https://getlockstep.cloud
maintainers:
  - name: welshstew
    url: https://github.com/welshstew
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: security
  # The image this chart version runs: update with every release (scripts/check-version.sh checks it)
  artifacthub.io/images: |
    - name: lockstep
      image: ghcr.io/welshstew/lockstep:0.5.0
      platforms: [linux/amd64, linux/arm64]
  # What changed in this chart version, shown on Artifact Hub: rewrite for every release
  artifacthub.io/changes: |
    - kind: added
      description: Values are edited in place in the compare view, and keys can be deleted on one side or both
    - kind: added
      description: Results group by folder or staged first, with folder-wide copy, expand/collapse all and a trimmable review
    - kind: added
      description: Sync plans can hold typed values once the creator acknowledges it
    - kind: fixed
      description: Large certificate expiry scans stream progress instead of timing out behind proxies
  artifacthub.io/links: |
    - name: Website
      url: https://getlockstep.cloud
    - name: Documentation
      url: https://getlockstep.cloud/docs/
    - name: Live demo
      url: https://demo.getlockstep.cloud
    - name: Source
      url: https://github.com/welshstew/lockstep
sources:
  - https://github.com/welshstew/lockstep
