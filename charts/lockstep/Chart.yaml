apiVersion: v2
name: lockstep
description: Compare, inspect and sync KV secrets across HashiCorp Vault and OpenBao clusters.
type: application
version: 0.11.0
appVersion: "0.11.0"
kubeVersion: ">=1.27.0-0"
keywords: [vault, hashicorp-vault, openbao, secrets, kv, compare, sync, certificates]
icon: https://getlockstep.cloud/icon.svg
home: https://getlockstep.cloud
maintainers:
  - name: welshstew
    url: https://github.com/welshstew
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: security
  # The image this chart version runs: update with every release (scripts/check-version.sh checks it)
  artifacthub.io/images: |
    - name: lockstep
      image: ghcr.io/welshstew/lockstep:0.11.0
      platforms: [linux/amd64, linux/arm64]
  # What changed in this chart version, shown on Artifact Hub: rewrite for every release
  artifacthub.io/changes: |
    - kind: changed
      description: "Breaking: exportMode defaults to encrypted; set any (or a Vault's own exportMode) to allow plain exports"
    - kind: added
      description: "A write policy per Vault (vaults[].writable, writePaths, denyPaths, allowDestroy, approvals, exportMode)"
    - kind: added
      description: "Plans signed with an Ed25519 key travel between installations (plans.*), with four-eyes approvals and undo plans"
    - kind: added
      description: "driftCheck CronJob: scheduled drift checks with a baseline, waivers and Pushgateway gauges"
    - kind: added
      description: "metrics.enabled and metrics.serviceMonitor: Prometheus metrics for the API, Vault calls and sign-ins"
    - kind: added
      description: "Exports encrypted with a passphrase or a team's age keys (exportRecipients), and streamed for big mounts"
    - kind: added
      description: "An environment matrix, KV v1 (read-only), a namespace picker, and system settings in the configuration comparison"
    - kind: added
      description: "auditReveals, apiDocs, sign-in throttling, browser security headers and structured logging (logging.format)"
  artifacthub.io/links: |
    - name: Website
      url: https://getlockstep.cloud
    - name: Documentation
      url: https://getlockstep.cloud/docs/
    - name: Live demo
      url: https://demo.getlockstep.cloud
    - name: Source
      url: https://github.com/welshstew/lockstep
sources:
  - https://github.com/welshstew/lockstep
