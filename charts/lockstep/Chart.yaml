apiVersion: v2
name: lockstep
description: Compare, inspect and sync KV secrets across HashiCorp Vault clusters.
type: application
version: 0.3.0
appVersion: "0.3.0"
kubeVersion: ">=1.27.0-0"
keywords: [vault, hashicorp-vault, secrets, kv, compare, sync, certificates]
icon: https://getlockstep.cloud/icon.svg
home: https://getlockstep.cloud
maintainers:
  - name: welshstew
    url: https://github.com/welshstew
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: security
  # The image this chart version runs: update with every release (scripts/check-version.sh checks it)
  artifacthub.io/images: |
    - name: lockstep
      image: ghcr.io/welshstew/lockstep:0.3.0
      platforms: [linux/amd64, linux/arm64]
  # What changed in this chart version, shown on Artifact Hub: rewrite for every release
  artifacthub.io/changes: |
    - kind: added
      description: Secret-engine export and import (encrypted by default), with import rules and transforms; compare a Vault against an export file
    - kind: added
      description: Override values on one side or both, typed in the UI
    - kind: added
      description: Keystore password finder; build comparison profiles by picking what to ignore
    - kind: added
      description: JWT sign-in (Vault's JWT auth method), in the UI and the CLI
    - kind: added
      description: exportMode value (any, encrypted or off) to control exports
  artifacthub.io/links: |
    - name: Website
      url: https://getlockstep.cloud
    - name: Documentation
      url: https://getlockstep.cloud/docs/
    - name: Live demo
      url: https://demo.getlockstep.cloud
    - name: Source
      url: https://github.com/welshstew/lockstep
sources:
  - https://github.com/welshstew/lockstep
