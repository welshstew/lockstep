{{- if not .Values.session.existingSecret }}
{{- $name := include "lockstep.sessionSecretName" . }}
{{- /* Keep the key across upgrades: a new key would sign everyone out, and replicas
       holding different keys during a rollout would reject each other's cookies. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := "" }}
{{- if and $existing $existing.data (index $existing.data "session-key") }}
{{- $key = index $existing.data "session-key" | b64dec }}
{{- else }}
{{- $key = randAlphaNum 64 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "lockstep.labels" . | nindent 4 }}
type: Opaque
data:
  session-key: {{ $key | b64enc | quote }}
{{- end }}
