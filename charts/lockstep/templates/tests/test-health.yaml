apiVersion: v1
kind: Pod
metadata:
  name: {{ include "lockstep.fullname" . }}-test
  labels:
    {{- include "lockstep.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: check
      image: {{ include "lockstep.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      # The image is distroless (no shell, no curl), so use its Python.
      command: ["python", "-c"]
      args:
        - |
          import json, urllib.request
          base = "http://{{ include "lockstep.fullname" . }}:{{ .Values.service.port }}"
          assert urllib.request.urlopen(base + "/healthz", timeout=10).status == 200
          cfg = json.load(urllib.request.urlopen(base + "/api/config", timeout=10))
          assert len(cfg["presets"]) == {{ len .Values.vaults }}, cfg
          assert cfg["k8s_auth"]["available"] is {{ if .Values.kubernetesAuth.enabled }}True{{ else }}False{{ end }}, cfg
          print("ok:", [p["name"] for p in cfg["presets"]])
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 128Mi}
