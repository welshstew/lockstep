{{- if .Values.driftCheck.enabled }}
{{- $d := .Values.driftCheck }}
{{- $name := include "lockstep.driftName" . }}
{{- $k8sAuth := or (not $d.left.tokenSecret.name) (not $d.right.tokenSecret.name) }}
{{- $ca := or .Values.vaultTls.caBundle.configMap .Values.vaultTls.caBundle.secret }}
{{- $files := or $d.baseline $d.waivers }}
{{- if $d.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lockstep.driftServiceAccountName" . }}
  labels:
    {{- include "lockstep.labels" . | nindent 4 }}
    app.kubernetes.io/component: drift-check
  {{- with $d.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
{{- end }}
{{- if $files }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "lockstep.labels" . | nindent 4 }}
    app.kubernetes.io/component: drift-check
data:
  {{- with $d.baseline }}
  drift.json: {{ . | quote }}
  {{- end }}
  {{- with $d.waivers }}
  waivers.yaml: {{ toYaml . | quote }}
  {{- end }}
---
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  labels:
    {{- include "lockstep.labels" . | nindent 4 }}
    app.kubernetes.io/component: drift-check
spec:
  schedule: {{ $d.schedule | quote }}
  suspend: {{ $d.suspend }}
  concurrencyPolicy: {{ $d.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ $d.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ $d.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 0                 # exit 1 means drift: running it again won't change that
      activeDeadlineSeconds: {{ $d.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "lockstep.driftSelectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "lockstep.driftServiceAccountName" . }}
          automountServiceAccountToken: {{ $k8sAuth }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: drift-check
              image: {{ include "lockstep.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["lockstep"]
              args:
                - compare
                {{- range $which, $s := dict "left" $d.left "right" $d.right }}
                - {{ printf "--%s-addr=%s" $which $s.addr | quote }}
                - {{ printf "--%s-mount=%s" $which $s.mount | quote }}
                - {{ printf "--%s-prefix=%s" $which $s.prefix | quote }}
                {{- with $s.namespace }}
                - {{ printf "--%s-namespace=%s" $which . | quote }}
                {{- end }}
                {{- with $s.name }}
                - {{ printf "--%s-name=%s" $which . | quote }}
                {{- end }}
                {{- if not $s.tokenSecret.name }}
                - --{{ $which }}-auth=kubernetes
                - {{ printf "--%s-auth-mount=%s" $which $s.authMount | quote }}
                - {{ printf "--%s-role=%s" $which $s.role | quote }}
                {{- end }}
                {{- end }}
                {{- with $d.profile }}
                - {{ printf "--profile=%s" . | quote }}
                {{- end }}
                {{- if or $d.baseline $d.baselineConfigMap.name }}
                - {{ printf "--baseline=/etc/lockstep/drift/%s" (ternary "drift.json" $d.baselineConfigMap.key (not (empty $d.baseline))) | quote }}
                {{- end }}
                {{- with $d.failOn }}
                - {{ printf "--fail-on=%s" . | quote }}
                {{- end }}
                {{- if $d.waivers }}
                - --waivers=/etc/lockstep/drift/waivers.yaml
                {{- end }}
                {{- with $d.pushgateway.url }}
                - {{ printf "--pushgateway=%s" . | quote }}
                - {{ printf "--pushgateway-job=%s" $d.pushgateway.job | quote }}
                {{- end }}
                {{- if not .Values.vaultTls.verify }}
                - --tls-skip-verify
                {{- end }}
                {{- range $d.extraArgs }}
                - {{ . | quote }}
                {{- end }}
              env:
                {{- range $which, $s := dict "left" $d.left "right" $d.right }}
                {{- with $s.tokenSecret.name }}
                - name: LOCKSTEP_{{ upper $which }}_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ . }}
                      key: {{ $s.tokenSecret.key }}
                {{- end }}
                {{- end }}
                {{- if $ca }}
                - name: VAULT_CACERT
                  value: /etc/lockstep/ca/{{ .Values.vaultTls.caBundle.key }}
                {{- end }}
                {{- if .Values.profiles }}
                - name: LOCKSTEP_PROFILES
                  value: {{ include "lockstep.profiles" . | quote }}
                {{- end }}
                - name: LOCKSTEP_LOG_LEVEL
                  value: {{ .Values.logging.level | quote }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              resources:
                {{- toYaml $d.resources | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                {{- if or $files $d.baselineConfigMap.name }}
                - name: drift
                  mountPath: /etc/lockstep/drift
                  readOnly: true
                {{- end }}
                {{- if $ca }}
                - name: vault-ca
                  mountPath: /etc/lockstep/ca
                  readOnly: true
                {{- end }}
          volumes:
            - name: tmp
              emptyDir: {sizeLimit: 16Mi}
            {{- if $d.baselineConfigMap.name }}
            - name: drift
              projected:
                sources:
                  - configMap: {name: {{ $d.baselineConfigMap.name }}}
                  {{- if $files }}
                  - configMap: {name: {{ $name }}}
                  {{- end }}
            {{- else if $files }}
            - name: drift
              configMap: {name: {{ $name }}}
            {{- end }}
            {{- with .Values.vaultTls.caBundle }}
            {{- if .configMap }}
            - name: vault-ca
              configMap: {name: {{ .configMap }}}
            {{- else if .secret }}
            - name: vault-ca
              secret: {secretName: {{ .secret }}}
            {{- end }}
            {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
