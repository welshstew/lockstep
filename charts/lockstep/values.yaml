# Lockstep Helm chart values. Every setting maps to a LOCKSTEP_* environment variable;
# see docs/configuration.md for details.

image:
  repository: ghcr.io/welshstew/lockstep   # signed release images (amd64, arm64); or your own build
  tag: ""                           # defaults to the chart's appVersion
  digest: ""                        # optional: sha256:… (takes precedence over tag)
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 2

nameOverride: ""
fullnameOverride: ""

# The URL users open (behind the ingress). Required for OIDC sign-in: the callback is
# <publicUrl>/api/auth/oidc/callback and must be in the Vault role's allowed_redirect_uris.
publicUrl: ""

session:
  # Encrypts the session cookie, which holds Vault tokens. All replicas must share it.
  # Either reference your own Secret, or let the chart generate one; a generated key is
  # kept across upgrades, and removing the release removes it.
  existingSecret: ""
  existingSecretKey: session-key
  ttlSeconds: 28800
  cookieSecure: true                # keep true behind TLS

# Vaults offered in the UI. `url` is how the pods reach Vault (never shown to browsers);
# `browserUrl` is only for display.
vaults: []
#  - name: Production
#    url: https://vault.prod.example.com
#    browserUrl: https://vault.prod.example.com
#    namespace: ""                   # Vault Enterprise namespace (optional)
#    writable: false                 # compare and read only: nothing is written to this Vault from Lockstep
#    exportMode: "off"               # no exports from this Vault, whatever exportMode says
#    exportProtection: [teams]       # exports from here only to a team's age keys
#  - name: Development
#    url: https://vault.dev.example.com
#    writePaths: ["app-config/**"]   # writes only here (KV: mount/path; otherwise the API path)
#    denyPaths: ["app-config/*/break-glass/**"]
#    allowDestroy: false             # no Destroy here, whatever allowDestroy says
#    approvals: 1                    # changes here only through plans someone else approved (up to 5 people)
#    approverPolicies: [lockstep-approver]  # only someone holding one of these Vault policies here may approve
#    exportMode: any                 # plain exports allowed from this Vault

allowCustomConnections: false       # let users type any Vault address (SSRF risk; see docs)
customUrlPatterns: []               # regexes a custom address's origin (scheme://host[:port]) must fully match
customAllowPrivate: false           # custom addresses may resolve to private, loopback or link-local IPs
maxTreeSecrets: 5000
# Secret-engine exports hold values: encrypted (only with a one-time key) | any (users choose
# encrypted or plain) | off. A Vault's own exportMode (under vaults) replaces this for that Vault.
exportMode: encrypted
# How encrypted exports may be protected: key (one-time), passphrase, age (any age keys), teams
# (only the exportRecipients teams). Empty: any way. A Vault's exportProtection narrows it.
exportProtection: []
# Teams an export can be encrypted to: members open it with their own age identity (or age -d)
exportRecipients: []
#  - name: Platform
#    recipients: ["age1…", "age1…"]
# Offer Destroy (every version and the metadata of a secret, no undo). Vault policies still apply.
allowDestroy: true
# Look-only: refuse every write from Lockstep (browsing, comparing, exports and policies still work)
readOnly: false
# Write ACL policies and auth roles from the Policies tab: on | off (off where Terraform owns them)
policyApply: "on"
# Create userpass users and reset their passwords (Policies › Roles): on | off. Meant for dev Vaults
userWrite: "off"
auditReveals: "off"                 # audit-log a secret.reveal event when values are shown (names only)
apiDocs: "on"                       # Swagger UI at /api/docs and /api/openapi.json; "off" hides them
# Offer Copy next to shown values in Browse
allowClipboard: true

# Sync and access plans that travel between installations (docs: configuration.md#plans-between-installations).
# Without a signing key, plans verify only on installations with the same session key.
plans:
  issuer: ""                        # this installation's name in plans (default: publicUrl's host)
  ttlHours: 168                     # how long a new plan can be applied
  approvals: 0                      # 1-5: every plan (sync, access, undo) applied here needs that many other people's approvals
  approverPolicies: []              # if set, approvers must hold one of these Vault policies (e.g. via an identity group)
  signingKeySecret:                 # a Secret holding the Ed25519 private key (`lockstep plan-key` makes one)
    name: ""
    key: signing-key
  trustedKeys: []                   # installations whose plans this one applies
#    - {name: dev-lockstep, key: <base64 public key>}

# Prometheus metrics at /metrics on the http port: API requests and latency by route template,
# calls to each Vault, sign-ins and 429s. Labels never hold secret paths, users or tokens.
metrics:
  enabled: false
  # Optional: a Secret holding a bearer token Prometheus must send (LOCKSTEP_METRICS_TOKEN)
  tokenSecret:
    name: ""
    key: token
  serviceMonitor:                   # for the Prometheus Operator (needs its CRDs)
    enabled: false
    interval: 30s
    labels: {}                      # e.g. release: kube-prometheus-stack

# A scheduled drift check: a CronJob runs `lockstep compare` between two locations and fails
# (and optionally pushes gauges to a Prometheus Pushgateway) when there's drift. It signs in to
# each Vault with its own service account (Vault's kubernetes auth), or a token from a Secret.
# See docs/drift-monitoring.md.
driftCheck:
  enabled: false
  schedule: "17 * * * *"            # hourly
  suspend: false
  left:
    addr: ""                        # how the job reaches this Vault, e.g. https://vault.prod.svc:8200
    namespace: ""
    mount: ""
    prefix: ""
    name: ""                        # label in metrics and logs (default: the host)
    role: ""                        # kubernetes auth: the Vault role for the job's service account
    authMount: kubernetes
    tokenSecret: {name: "", key: token}   # instead of kubernetes auth: a Secret with a Vault token
  right:
    addr: ""
    namespace: ""
    mount: ""
    prefix: ""
    name: ""
    role: ""
    authMount: kubernetes
    tokenSecret: {name: "", key: token}
  profile: ""                       # a name from `profiles`
  # Accepted drift, from `lockstep baseline update`: the JSON itself, or a ConfigMap you keep
  baseline: ""
  baselineConfigMap: {name: "", key: drift.json}
  failOn: ""                        # any | new | changed (default: new with a baseline, any without)
  waivers: []                       # [{path, key, owner, reason, expires}]; an expired one fails the run.
  waiversSignature:                 # from `lockstep waivers sign`: the file's issuer and signature lines
    issuer: {}                      # {name: …, key_id: …}
    signature: ""
  requireSigned: false              # refuse a baseline or waivers that aren't signed by a key in plans.trustedKeys
  pushgateway:
    url: ""                         # e.g. http://pushgateway.monitoring:9091
    job: lockstep
  extraArgs: []                     # more `lockstep compare` options
  serviceAccount:
    create: true
    name: ""                        # default: <release>-drift-check; bind your Vault role to it
    annotations: {}
  concurrencyPolicy: Forbid
  activeDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  resources:
    requests: {cpu: 20m, memory: 96Mi}
    limits: {memory: 384Mi}
  egress: []                        # with networkPolicy.enabled: rules to the Pushgateway (Vaults use vaultEgress)

# Server log on stderr (the audit log on stdout is separate)
logging:
  level: info       # debug | info | warning | error; debug adds every call to a Vault
  format: text      # text | json

vaultTls:
  verify: true
  # A PEM CA bundle for Vaults with a private CA, from a ConfigMap or Secret you manage.
  caBundle:
    configMap: ""
    secret: ""
    key: ca.crt

# Sign in to Vault as this pod's service account (Vault's kubernetes auth method).
# Anyone who can open Lockstep can then act with that account's Vault access:
# keep it off unless you mean it, and pin the roles. See docs/authentication.md.
kubernetesAuth:
  enabled: false
  roles: []                         # Vault role names users may pick; empty = any
  mount: kubernetes

serviceAccount:
  create: true
  name: ""                          # defaults to the release's full name
  annotations: {}
  # Mount the token only when Kubernetes auth needs it ("auto"), or force true/false.
  automountToken: auto

# Shared suggestion patterns for the Policies tab's Build & suggest: what each level of a mount's
# tree means and which policies to suggest for it (see `lockstep schema suggest-pattern`).
policyPatterns: []
#  - name: per app and environment
#    layout: "{app}/{env}/**"
#    policies:
#      - name: "{app}-{env}-app"
#        rules: [{where: "{app}/{env}/**", can: [read, history]}]
#    compare: {pair: {env: [dev, prod]}}

# Shared policy profiles for the Policies tab's Compare: pair policy names between two Vaults
# (* patterns), rewrite the left policy's paths before comparing, and leave policies out.
policyProfiles: []
# Shared configuration profiles for the Configuration tab: pair mount paths that differ between two
# Vaults (* patterns; a mount's roles and keys follow it), rewrite the left side's values, ignore paths.
configProfiles: []
#  - name: dev vs prod
#    mappings: [{left: "kv-dev", right: "kv-prod"}, {left: "kubernetes-*", right: "k8s-*"}]
#    rewrites: [{find: "dev.example.com", replace: "prod.example.com"}]
#    ignore: ["sandbox-*"]
#  - name: dev vs prod
#    mappings: [{left: "*-dev", right: "*-prod"}]
#    rewrites: [{find: "/dev/", replace: "/prod/"}]
#    ignore: [root, default]

# Shared comparison profiles, offered read-only to every user (see docs/usage.md).
# Patterns are globs over secret paths: * = one path segment, ** = any depth.
profiles: []
#  - name: Prod vs staging services
#    description: services/<name>/prod against services/<name>/staging
#    leftMount: app-config           # optional: preselect each side's mount and prefix
#    leftPrefix: ""
#    rightMount: app-config
#    rightPrefix: ""
#    rules:
#      mappings:                     # both sides need the same wildcards, in the same order
#        - {left: "services/*/prod/**", right: "services/*/staging/**"}
#      ignoreKeys:                   # key globs, optionally only under a path glob
#        - {key: host, path: "services/**"}
#      ignorePaths: ["legacy/**"]
#      rewrites:                     # words in values read as their counterpart (whole words)
#        - {left: prod, right: staging}

extraEnv: []                        # additional env vars (name/value or valueFrom)

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop: [ALL]

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: lockstep.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: lockstep-tls
  #    hosts: [lockstep.example.com]

podDisruptionBudget:
  enabled: true                     # only created when replicaCount > 1
  minAvailable: 1

# Restrict traffic to and from the pods. Egress must allow DNS and your Vaults.
networkPolicy:
  enabled: false
  ingressFrom: []                   # peers allowed to reach the pods (e.g. the ingress controller)
  vaultEgress: []                   # egress rules to your Vaults (ipBlock/namespaceSelector + ports)
  allowDns: true

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
