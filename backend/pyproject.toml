[project]
name = "lockstep"
version = "0.2.0"
description = "Compare and sync KV v2 secrets across HashiCorp Vault mounts and clusters"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
  "fastapi==0.162.2",
  "uvicorn[standard]==0.54.0",
  "pydantic-settings==2.16.2",
  "httpx==0.28.1",
  "cryptography==50.0.2",
  "pyyaml==6.0.3",
]

[project.scripts]
lockstep = "lockstep.cli:main"

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1"]

[build-system]
requires = ["setuptools>=77"]  # SPDX license expressions (PEP 639)
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.bandit]
exclude_dirs = ["tests"]
